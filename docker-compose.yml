# Services locaux de Kanvô Connect : `docker compose up -d` démarre PostgreSQL et Mailpit.
# Les identifiants viennent du fichier .env (DB_DATABASE, DB_USERNAME, DB_PASSWORD), lu automatiquement par Compose.
name: kanvo-connect

services:
    db:
        image: postgres:16-alpine
        container_name: kanvo-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-kanvo}
            POSTGRES_USER: ${DB_USERNAME:-kanvo}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env}
        ports:
            # Accessible uniquement depuis cet ordinateur.
            - '127.0.0.1:${DB_PORT:-5434}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 3s
            retries: 10

    # Boîte de réception de test : les e-mails du site s'affichent sur http://localhost:8025.
    mail:
        image: axllent/mailpit:v1.27
        container_name: kanvo-mail
        restart: unless-stopped
        ports:
            - '127.0.0.1:${MAIL_PORT:-1025}:1025'
            - '127.0.0.1:8025:8025'

volumes:
    pgdata:
        name: kanvo-pgdata
